name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:

  test:

    runs-on: ubuntu-latest

    strategy:

      matrix:

        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:

      - name: Checkout

        uses: actions/checkout@v6

      - name: Setup Python

        uses: actions/setup-python@v6

        with:

          python-version: ${{ matrix.python-version }}

      - name: Install

        run: |

          python -m pip install --upgrade pip

          python -m pip install -e ".[dev]"

      - name: Ruff

        run: ruff check .

      - name: Tests

        run: pytest