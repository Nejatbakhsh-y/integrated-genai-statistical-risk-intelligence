raw_source_provenance:
  sec_companyfacts:
    source_family: "SEC_EDGAR_XBRL_COMPANYFACTS"
    endpoint_template: "https://data.sec.gov/api/xbrl/companyfacts/CIK##########.json"
    authentication_required: false
    local_raw_directory: "data/raw/sec_xbrl/companyfacts"
    git_tracked: false
    manifest: "reports/validation/milestone4_step_4_2_raw_companyfacts_manifest.csv"
    attempted_ciks: 729
    http_200_or_cache: 724
    http_404_no_companyfacts: 5

sponsor_financial_alignment:
  transformation_version: "4.2.0"
  source_family: "SEC_EDGAR_XBRL"
  monetary_unit: "USD"
  annual_forms:
    - "10-K"
    - "10-K/A"
    - "10-KT"
    - "10-KT/A"
    - "20-F"
    - "20-F/A"
    - "40-F"
    - "40-F/A"
  fiscal_year_rule: "XBRL fact fy == sponsor plan_year"
  temporal_eligibility_rule: "fact filed_date <= sponsor-year forecast_cutoff"
  period_end_rule: "fact period_end <= sponsor-year forecast_cutoff"
  duration_rule: "annual duration contexts must span 250 through 450 days inclusive"
  selection_rule: >
    Among eligible synonym concepts, select the latest period_end, then the latest
    filed_date, then the lowest frozen concept-priority rank, then accession number.
  future_backfill_allowed: false
  retrospective_restated_value_after_cutoff_allowed: false
  non_usd_currency_conversion_allowed: false
  concept_priority:
    total_assets:
      - "us-gaap:Assets"
      - "ifrs-full:Assets"
    total_liabilities:
      - "us-gaap:Liabilities"
      - "ifrs-full:Liabilities"
    debt:
      - "us-gaap:LongTermDebtAndFinanceLeaseObligations"
      - "us-gaap:LongTermDebt"
      - "us-gaap:LongTermDebtAndFinanceLeaseObligationsNoncurrent"
      - "us-gaap:LongTermDebtNoncurrent"
      - "ifrs-full:Borrowings"
      - "ifrs-full:NoncurrentBorrowings"
    cash:
      - "us-gaap:CashAndCashEquivalentsAtCarryingValue"
      - "us-gaap:CashCashEquivalentsRestrictedCashAndRestrictedCashEquivalents"
      - "ifrs-full:CashAndCashEquivalents"
    revenue:
      - "us-gaap:RevenueFromContractWithCustomerExcludingAssessedTax"
      - "us-gaap:SalesRevenueNet"
      - "us-gaap:Revenues"
      - "ifrs-full:Revenue"
    operating_income:
      - "us-gaap:OperatingIncomeLoss"
      - "ifrs-full:ProfitLossFromOperatingActivities"
    operating_cash_flow:
      - "us-gaap:NetCashProvidedByUsedInOperatingActivities"
      - "ifrs-full:CashFlowsFromUsedInOperatingActivities"
    pension_plan_assets:
      - "us-gaap:DefinedBenefitPlanFairValueOfPlanAssets"
      - "ifrs-full:FairValueOfPlanAssets"
    pension_projected_benefit_obligation:
      - "us-gaap:DefinedBenefitPlanProjectedBenefitObligation"
      - "ifrs-full:PresentValueOfDefinedBenefitObligation"
    pension_employer_contributions:
      - "us-gaap:DefinedBenefitPlanContributionsByEmployer"
      - "ifrs-full:ContributionsByEmployer"
  derived_variables:
    profitability: "sec_operating_income / sec_revenue"
    leverage: "sec_total_liabilities / sec_total_assets"
    liquidity: "sec_cash / sec_total_assets"
    pension_size: "Form5500 pension liabilities / sec_total_assets"
    pension_assets_to_sponsor_assets: "Form5500 pension assets / sec_total_assets"
    pension_contributions_to_revenue: "Form5500 contributions / sec_revenue"


data_families:
  pension:
    status: "step_4_1_base_constructed_step_4_2_denominator_added"
    fields:
      - funded_ratio
      - assets
      - liabilities
      - contributions
      - benefit_payments
      - participants
      - pension_size
      - pension_assets_to_sponsor_assets
      - pension_liabilities_to_sponsor_assets
      - pension_contributions_to_revenue
    pension_size_status: "defined_step_4_2_as_form5500_liabilities_over_sec_total_assets"

  sponsor_financials:
    status: "step_4_2_complete"
    source_family: "SEC_EDGAR_XBRL"
    fields:
      - sec_total_assets
      - sec_total_liabilities
      - sec_debt
      - sec_cash
      - sec_revenue
      - sec_operating_income
      - sec_operating_cash_flow
      - sec_profitability
      - sec_leverage
      - sec_liquidity
      - sec_pension_plan_assets
      - sec_pension_projected_benefit_obligation
      - sec_pension_employer_contributions
    raw_missingness_preserved: true

  market:
    status: "next_step_4_3"
    candidate_fields:
      - equity_return
      - equity_volatility
      - equity_drawdown
      - market_capitalization

  macro:
    status: "not_yet_ingested"
    candidate_fields:
      - interest_rates
      - inflation
      - credit_conditions
      - unemployment

pension_aggregation:
  target_grain: "sponsor_year"
  temporal_eligibility_rule: "plan information_date <= sponsor-year forecast_cutoff"
  monetary_fields:
    rule: "sum_across_available_plans_if_field_complete_within_available_set"
    partial_sum_if_available_plan_field_missing: false
  funded_ratio:
    rule: "aggregate_assets_divided_by_aggregate_liabilities"
    require_positive_liabilities: true
    unweighted_plan_ratio_mean_allowed: false
  participants:
    rule: "sum_across_available_plans_if_field_complete_within_available_set"
    overlap_audit_required: true
    overlap_risk_flag: "participants_overlap_risk"
  source_provenance:
    available_plan_source_files_retained: true
  pension_size:
    status: "defined_step_4_2"
    rule: "Form5500 aggregate pension liabilities divided by SEC total assets"
    require_positive_sec_total_assets: true

temporal_integrity:
  required_columns:
    - information_date
    - forecast_cutoff
  governing_rule: "information_date <= forecast_cutoff"
  future_information_allowed: false
  forward_fill_from_future_allowed: false
  retrospective_value_substitution_allowed: false
  forecast_cutoff_policy:
    status: "frozen_step_4_1"
    policy_id: "OCTOBER_15_T_PLUS_1"
    rule: "October 15 of calendar year t+1"
    plan_year_reference: "t"
    month: 10
    day: 15
    common_across_sponsors_within_plan_year: true
    outcome_independent: true
    candidate_cutoff_diagnostics_required: true
    candidate_policy_ids:
      - "JULY_31_T_PLUS_1"
      - "SEPTEMBER_30_T_PLUS_1"
      - "OCTOBER_15_T_PLUS_1"
      - "DECEMBER_31_T_PLUS_1"
  analytical_availability:
    late_plan_filings_excluded: true
    missing_information_date_excluded: true
    sponsor_year_skeleton_retained_when_no_plan_is_available: true
    sec_facts_filed_after_cutoff_excluded: true
    sec_facts_for_other_fiscal_years_excluded: true
    sponsor_year_retained_when_sec_financials_missing: true

missingness:
  silent_zero_fill_allowed: false
  future_backfill_allowed: false
  partial_plan_sum_when_available_field_missing: false
  sec_missingness_preserved: true
  non_usd_sec_facts_preserved_as_missing: true
  final_imputation_policy_status: "not_selected"

scientific_controls:
  outcome_data_may_define_features: false
  final_holdout_may_define_features: false
  post_cutoff_information_allowed: false
  raw_source_provenance_required: true
  transformation_version_required: true

