market_alignment:
  transformation_version: 4.3.0
  price_source_family: YAHOO_FINANCE_CHART_DAILY
  ticker_mapping_source: SEC_CURRENT_TICKER_EXCHANGE_ASSOCIATIONS
  ticker_mapping_role: identifier metadata only; not a model feature
  ticker_mapping_selection_rule: within CIK sort by shortest SEC ticker, then ticker, then exchange; use
    first Yahoo-compatible symbol returning USD daily history
  price_currency: USD required; non-USD histories remain missing
  forecast_cutoff_rule: latest trading close on or before forecast_cutoff
  return_price_basis: adjusted close
  market_cap_price_basis: regular close on provider split basis
  trailing_window_price_observations: 253
  trailing_window_trading_intervals: 252
  equity_return_rule: adjusted_close_t / adjusted_close_t_minus_252_trading_intervals - 1
  equity_volatility_rule: std(daily log returns) * sqrt(252)
  equity_drawdown_rule: minimum(adjusted_close / running_peak - 1) over trailing window
  shares_outstanding_source: SEC Company Facts cached in Step 4.2
  shares_outstanding_concept_priority:
  - dei:EntityCommonStockSharesOutstanding
  - us-gaap:CommonStockSharesOutstanding
  shares_temporal_rule: latest eligible periodic-filing shares fact with filed_date <= cutoff and period_end
    <= cutoff
  market_capitalization_rule: regular market_close multiplied by point-in-time SEC shares normalized to
    the provider split basis; constructed only for a unique-ticker CIK
  split_basis_normalization_rule: multiply SEC shares by cumulative provider split ratios after the selected
    shares period_end; split metadata is unit-normalization provenance only
  future_price_backfill_allowed: false
  future_share_filing_backfill_allowed: false
  manual_ticker_inference_allowed: false
  raw_missingness_preserved: true
