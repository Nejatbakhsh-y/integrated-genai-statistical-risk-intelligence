pension_aggregation:
  target_grain: sponsor_year
  temporal_eligibility_rule: plan information_date <= sponsor-year forecast_cutoff
  monetary_fields:
    rule: sum_across_available_plans_if_field_complete_within_available_set
    partial_sum_if_available_plan_field_missing: false
  funded_ratio:
    rule: aggregate_assets_divided_by_aggregate_liabilities
    require_positive_liabilities: true
    unweighted_plan_ratio_mean_allowed: false
  participants:
    rule: sum_across_available_plans_if_field_complete_within_available_set
    overlap_audit_required: true
    overlap_risk_flag: participants_overlap_risk
  source_provenance:
    available_plan_source_files_retained: true
  pension_size:
    status: defined_step_4_2
    rule: Form5500 aggregate pension liabilities divided by SEC total assets
    require_positive_sec_total_assets: true
temporal_integrity:
  required_columns:
  - information_date
  - forecast_cutoff
  governing_rule: information_date <= forecast_cutoff
  future_information_allowed: false
  forward_fill_from_future_allowed: false
  retrospective_value_substitution_allowed: false
  forecast_cutoff_policy:
    status: frozen_step_4_1
    policy_id: OCTOBER_15_T_PLUS_1
    rule: October 15 of calendar year t+1
    plan_year_reference: t
    month: 10
    day: 15
    common_across_sponsors_within_plan_year: true
    outcome_independent: true
    candidate_cutoff_diagnostics_required: true
    candidate_policy_ids:
    - JULY_31_T_PLUS_1
    - SEPTEMBER_30_T_PLUS_1
    - OCTOBER_15_T_PLUS_1
    - DECEMBER_31_T_PLUS_1
  analytical_availability:
    late_plan_filings_excluded: true
    missing_information_date_excluded: true
    sponsor_year_skeleton_retained_when_no_plan_is_available: true
    sec_facts_filed_after_cutoff_excluded: true
    sec_facts_for_other_fiscal_years_excluded: true
    sponsor_year_retained_when_sec_financials_missing: true
    market_prices_after_cutoff_excluded: true
    market_shares_filed_after_cutoff_excluded: true
    sponsor_year_retained_when_market_data_missing: true
    current_ticker_metadata_used_as_model_feature: false
    macro_vintage_after_cutoff_excluded: true
