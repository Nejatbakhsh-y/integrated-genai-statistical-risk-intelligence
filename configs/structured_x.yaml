sponsor_financial_alignment:
  transformation_version: 4.2.0
  source_family: SEC_EDGAR_XBRL
  monetary_unit: USD
  annual_forms:
  - 10-K
  - 10-K/A
  - 10-KT
  - 10-KT/A
  - 20-F
  - 20-F/A
  - 40-F
  - 40-F/A
  fiscal_year_rule: XBRL fact fy == sponsor plan_year
  temporal_eligibility_rule: fact filed_date <= sponsor-year forecast_cutoff
  period_end_rule: fact period_end <= sponsor-year forecast_cutoff
  duration_rule: annual duration contexts must span 250 through 450 days inclusive
  selection_rule: 'Among eligible synonym concepts, select the latest period_end, then the latest filed_date,
    then the lowest frozen concept-priority rank, then accession number.

    '
  future_backfill_allowed: false
  retrospective_restated_value_after_cutoff_allowed: false
  non_usd_currency_conversion_allowed: false
  concept_priority:
    total_assets:
    - us-gaap:Assets
    - ifrs-full:Assets
    total_liabilities:
    - us-gaap:Liabilities
    - ifrs-full:Liabilities
    debt:
    - us-gaap:LongTermDebtAndFinanceLeaseObligations
    - us-gaap:LongTermDebt
    - us-gaap:LongTermDebtAndFinanceLeaseObligationsNoncurrent
    - us-gaap:LongTermDebtNoncurrent
    - ifrs-full:Borrowings
    - ifrs-full:NoncurrentBorrowings
    cash:
    - us-gaap:CashAndCashEquivalentsAtCarryingValue
    - us-gaap:CashCashEquivalentsRestrictedCashAndRestrictedCashEquivalents
    - ifrs-full:CashAndCashEquivalents
    revenue:
    - us-gaap:RevenueFromContractWithCustomerExcludingAssessedTax
    - us-gaap:SalesRevenueNet
    - us-gaap:Revenues
    - ifrs-full:Revenue
    operating_income:
    - us-gaap:OperatingIncomeLoss
    - ifrs-full:ProfitLossFromOperatingActivities
    operating_cash_flow:
    - us-gaap:NetCashProvidedByUsedInOperatingActivities
    - ifrs-full:CashFlowsFromUsedInOperatingActivities
    pension_plan_assets:
    - us-gaap:DefinedBenefitPlanFairValueOfPlanAssets
    - ifrs-full:FairValueOfPlanAssets
    pension_projected_benefit_obligation:
    - us-gaap:DefinedBenefitPlanProjectedBenefitObligation
    - ifrs-full:PresentValueOfDefinedBenefitObligation
    pension_employer_contributions:
    - us-gaap:DefinedBenefitPlanContributionsByEmployer
    - ifrs-full:ContributionsByEmployer
  derived_variables:
    profitability: sec_operating_income / sec_revenue
    leverage: sec_total_liabilities / sec_total_assets
    liquidity: sec_cash / sec_total_assets
    pension_size: Form5500 pension liabilities / sec_total_assets
    pension_assets_to_sponsor_assets: Form5500 pension assets / sec_total_assets
    pension_contributions_to_revenue: Form5500 contributions / sec_revenue
