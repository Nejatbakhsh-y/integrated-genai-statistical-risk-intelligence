    plan_year_end: 2024
primary_artifact:
  path: data/processed/outcomes.parquet
  git_tracked: false
  status: not_yet_constructed
outcome_contract:
  observation_grain:
  - sponsor_id
  - predictor_plan_year
  horizon_years: 1
  funded_ratio_definition: FR(i,t) = assets(i,t) / liabilities(i,t)
  continuous_definition: DeltaFR(i,t+1) = FR(i,t+1) - FR(i,t)
  binary_definition: D(i,t+1) = 1{DeltaFR(i,t+1) <= -c}
  negative_delta_means: funding_deterioration
  target_year_rule: target_plan_year == predictor_plan_year + 1
  same_year_target_allowed: false
  nonconsecutive_year_pairing_allowed: false
  future_target_as_predictor_allowed: false
  forward_filled_future_target_allowed: false
  duplicate_sponsor_year_allowed: false
  positive_liabilities_required: true
  missing_funded_ratio_policy: preserve_missing_no_imputation
threshold_contract:
  symbol: c
  primary_value: null
  status: pending_step_5_2_prespecification
  final_holdout_may_select_threshold: false
  final_holdout_may_tune_threshold: false
  robustness_thresholds_required: true
  rule: Primary c must be frozen before final-holdout evaluation and cannot be selected after inspecting
    final-holdout performance.
scientific_controls:
  outcome_code_independent_from_model_training: true
  model_fitting_allowed_in_milestone_5: false
  final_holdout_inspection_allowed_in_milestone_5: false
  prompt_tuning_allowed_using_outcomes: false
  threshold_selection_using_final_holdout: false
  silent_target_imputation_allowed: false
acceptance_tests:
- year_alignment
- no_accidental_same_year_target
- no_forward_filled_future_information
- denominator_validity
- duplicate_sponsor_year_detection
- threshold_consistency
- missingness_preservation
roadmap:
  step_5_0:
    name: freeze_outcome_construction_contract_and_kickoff
